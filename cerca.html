<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="" type="image/avif" />
    <link rel="icon" href="asset/logo/LOGO-ICEMOVIES-iconapiccola.png" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>IceMovies/Cerca</title>
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
      name="viewport"
    />
    <meta name="viewport" content="width=device-width" />
    <meta
      name="description"
      content="Scopri cosa vedere stasera! Trova recensioni, consigli, notizie e approfondimenti sui tuoi titoli preferiti."
    />
    <meta
      name="keywords"
      content="consigli film, consigli serie tv, consigli anime, migliori film, migliori serie tv, migliori anime, film da vedere, serie tv da vedere, anime da vedere, novità film, novità serie tv,novità anime,"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      #body-cerca {
        background: rgb(0, 0, 0);
        background: -moz-linear-gradient(
          top,
          rgb(0, 0, 0) 0%,
          rgb(10, 22, 70) 48%,
          rgb(0, 0, 0) 100%
        );
        background: -webkit-linear-gradient(
          top,
          rgb(0, 0, 0) 0%,
          rgb(10, 22, 70) 48%,
          rgb(0, 0, 0) 100%
        );
        background: linear-gradient(
          to bottom,
          rgb(0, 0, 0) 0%,
          rgb(10, 22, 70) 48%,
          rgb(0, 0, 0) 100%
        );
      }

      .navbar_main_pc {
        align-items: center;
        width: 100%;
        display: flex;
        justify-content: space-between;
      }

      .searchs_pc {
        display: flex;
        gap: 10px;
        margin: 20px;
        min-height: 2rem;
        min-width: 15rem;
        border-radius: 14px;
        padding: 10px 20px;
        box-shadow: inset 4px -5px 12px 1px #0091ff;
        background-color: transparent;
      }

      .search_input_p {
        color: var(--font-base);
        font-size: 20px;
        min-height: 100%;
        min-width: 15rem;
        padding: 10px 5px;
        background-color: transparent;
        outline: none;
        border: none;
      }

      .searchbtn_pc {
        border: none;
        background-color: transparent;
      }
      .searchbtn_pc img {
        width: 50px;
      }
      .logo_pc {
        width: 300px;
      }

      .logo_pc img {
        width: 100%;
        object-fit: cover;
      }
      .torna-home-btn {
        background-color: transparent;
        width: 50px;
        border: 2px solid #29f6f4;
        border-radius: 10px;
      }
      .torna-home-btn img {
        object-fit: cover;
        width: 100%;
      }
      .tasti-pag-cerca {
        display: flex;
        align-items: center;
        margin-right: 20px;
      }

      #main-cerca {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        gap: 26px;
        padding: 40px 30px;
      }

      .card {
        display: flex;
        flex-direction: column;
        width: 250px;
        min-height: 480px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        text-align: center;
        justify-content: center;
        position: relative;
        background-image: url("sfondo-card.webp");
        justify-content: flex-start;
      }

      .card img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        object-position: top;
      }

      .nome {
        padding: 10px;
        font-size: 25px;
        font-weight: bold;
        color: white;
        font-family: "Cormorant Garamond";
      }

      .card .rating {
        font-size: 19px;
        color: rgb(200, 200, 32);
        margin-bottom: 10px;
        font-weight: bold;
        font-family: "Cormorant Garamond";
        font-weight: bold;
      }

      .card .release {
        font-size: 19px;
        margin-bottom: 20px;
        color: white;
        font-family: "Cormorant Garamond";
        font-weight: bold;
      }

      .card .description {
        position: absolute;
        bottom: -100%;
        left: 0;
        width: 100%;
        background-image: url("sfondo-card.webp");
        color: white;
        padding: 15px;
        box-sizing: border-box;
        transition: bottom 0.5s ease-in-out;
        height: 60%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 18px;
        font-family: "Cormorant Garamond";
        font-weight: bold;
      }

      .card:hover .description {
        bottom: 0;
      }

      .presentazione {
        display: flex;
        justify-content: center;
        color: white;
      }

      .presentazione h2 {
        width: 50%;
        font-size: 45px;
        padding: 30px;
      }

      footer {
        background-color: var(--colore-background);
        color: var(--font-base);
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }

      .footer_info {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        padding: 5px;
      }

      .footer-logo {
        width: 300px;
      }
      .footer-logo > img {
        width: 100%;
        object-fit: cover;
      }

      .footer-contact-title {
        font-size: 30px;
        font-weight: 900;
        border-bottom: solid;
        font-family: "Cormorant Garamond";
      }
      .btn-torna-su {
        font-size: 20px;
        width: 150px;
        height: 68px;
        background-color: transparent;
        border-color: var(--colore-secondario);
        box-shadow: inset 2px -7px 20px 6px var(--colore-secondario);
        color: var(--font-base);
        border-radius: 16px;
        margin: 10px;
      }

      .footer-logo,
      .footer-sali {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .footer-contact {
        flex-direction: column;
        flex: 1.5;
      }

      .footer-contatti {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        font-size: 19px;
      }

      .copyright-section {
        border-top: solid white;
        min-height: 50px;
        display: flex;
        justify-content: center;
        color: var(--colore-quarto);
        padding: 10px;
      }
      @media (max-width: 820px) {
        .footer_info {
          flex-direction: column;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .win,
      .lose,
      .footlogo {
        animation: bounce 1s infinite alternate;
      }
    </style>
  </head>
  <body id="body-cerca">
    <nav class="navbar_main_pc">
      <div class="logo_pc"><img src="asset/logo/LOGO-ICEMOVIES.png" /></div>
      <div class="tasti-pag-cerca">
        <div class="searchs_pc">
          <input
            type="text"
            class="search_input_p"
            id="search-p"
            placeholder="Ricerca..."
            autocomplete="off"
          />
          <button class="searchbtn_pc">
            <img src="icons8-ricerca-96.png" alt="carca" />
          </button>
        </div>
        <a href="index.html" class="torna-home-btn"
          ><img src="icons8-house-96.png" alt="torna alla home page"
        /></a>
      </div>
    </nav>
    <main id="main-cerca">
      <div class="presentazione">
        <h2>
          Sei alla ricerca del film perfetto per la serata o vuoi scoprire il
          tuo prossimo anime preferito? Sei nel posto giusto! 🔍
        </h2>
      </div>
    </main>
    <footer>
      <div class="footer_info">
        <div class="footer-logo">
          <img
            class="footlogo"
            src="asset/logo/LOGO-ICEMOVIES.png"
            alt="LOGO-ICEMOVIES"
          />
        </div>
        <div class="footer-contact">
          <h4 class="footer-contact-title">Contatti</h4>
          <div class="footer-contatti">
            <img
              class="icon-contact"
              src="asset/icone/icons-email-96.png"
              alt="email-icon"
            />
            <p style="font-weight: 700">Email:</p>
            <p style="font-style: italic">team-1@gmail.com</p>
          </div>
          <div class="footer-contatti">
            <img
              class="icon-contact"
              src="asset/icone/icons-tell-96.png"
              alt="telefono-icon"
            />
            <p style="font-weight: 700">Telefono:</p>
            <p style="font-style: italic">345 666 5551</p>
          </div>
        </div>
        <div class="footer-sali">
          <button
            class="btn-torna-su"
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
          >
            TORNA SU' ⬆
          </button>
        </div>
      </div>
      <div class="copyright-section">
        <p>&copy; Fullstack34 Team1 <span id="year"></span></p>
      </div>
    </footer>
    <script>
      const main = document.getElementById("main-cerca");
      const input = document.getElementById("search-p");
      const searchButton = document.querySelector(".searchbtn_pc");
      const apiKey = "202cd8db"; // per OMDB
      const animeApiUrl = "https://api.jikan.moe/v4/anime";

      searchButton.addEventListener("click", () => {
        recuperaFilm();
        recuperaAnime();
      });
      async function recuperaFilm() {
        const query = input.value;
        if (!query) return;

        try {
          const response = await fetch(
            `https://www.omdbapi.com/?apikey=${apiKey}&s=${query}`
          );
          const data = await response.json();
          if (data.Search) {
            const moviesDetails = await Promise.all(
              data.Search.map(async (movie) => {
                const detailsResponse = await fetch(
                  `http://www.omdbapi.com/?i=${movie.imdbID}&apikey=${apiKey}`
                );
                return await detailsResponse.json();
              })
            );

            const sortedMovies = moviesDetails
              .filter((movie) => movie.Released !== "N/A")
              .sort((a, b) => new Date(b.Released) - new Date(a.Released))
              .slice(0, 20);
            showMovies(sortedMovies);
            console.log(sortedMovies);
          } else {
            console.error("Nessun film trovato");
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function recuperaAnime() {
        const query = input.value;
        if (!query) return;

        try {
          const response = await fetch(
            `https://api.jikan.moe/v4/anime?q=${query}`
          );
          const data = await response.json();

          if (data.data.length) {
            showAnime(
              data.data.map((anime) => ({
                title: anime.title,
                image: anime.images.jpg.image_url,
              }))
            );
          } else {
            main.innerHTML += "<p>Nessun anime trovato</p>";
          }
        } catch {
          main.innerHTML += "<p>Errore nel recupero degli anime</p>";
        }
      }

      // Funzione per mostrare FILM

      const container = document.createElement("div");
      container.classList.add("movies-container");
      function showMovies(films) {
        main.innerHTML = "";
        films.forEach((film) => {
          const card = document.createElement("div");
          card.className = "card";

          const immagine = document.createElement("img");
          immagine.className = "immagine";
          immagine.src =
            film.Poster !== "N/A" ? film.Poster : "placeholder.jpg";

          const nome = document.createElement("div");
          nome.className = "nome";
          nome.textContent = film.Title;

          const rating = document.createElement("div");
          rating.className = "rating";
          rating.textContent =
            film.imdbRating !== "N/A"
              ? `Rating: ${film.imdbRating}`
              : "Rating: N/A";

          const releaseDate = document.createElement("div");
          releaseDate.className = "release";
          releaseDate.textContent = `Released: ${film.Released}`;

          const description = document.createElement("div");
          description.className = "description";
          description.textContent =
            film.Plot !== "N/A" ? film.Plot : "Descrizione non disponibile.";

          description.style.display = "none";

          card.addEventListener("mouseover", () => {
            description.style.display = "block";
          });

          card.addEventListener("mouseout", () => {
            description.style.display = "none";
          });

          card.appendChild(immagine);
          card.appendChild(nome);
          card.appendChild(rating);
          card.appendChild(releaseDate);
          card.appendChild(description);
          // container.appendChild(card);
          main.appendChild(card);
        });
      }

      // Funzione per mostrare ANIME
      function showAnime(datas) {
        main.innerHTML = "";
        const container = document.createElement("div");
        container.classList.add("movies-container");

        datas.forEach((data) => {
          const div = document.createElement("div");
          div.classList.add("card");

          const h2 = document.createElement("h2");
          h2.classList.add("card-title");
          h2.textContent = data.title;

          const img = document.createElement("img");
          img.setAttribute("src", data.image);
          img.setAttribute("alt", data.title);

          div.appendChild(img);
          div.appendChild(h2);

          //   container.appendChild(div);
        });

        main.appendChild(div);
      }
    </script>
  </body>
</html>
